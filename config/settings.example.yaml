# =====================================================================
# cryptobot 設定ファイル
#
# 使い方: このファイルを config/settings.yaml にコピーして値を変えます。
#         `make setup` を実行すると自動でコピーされます。
# 注意:   秘密鍵やトークンはここに書きません。.env に書きます。
#         知らない項目を追加するとエラーで止まります（打ち間違い防止のため）。
# =====================================================================

exchange:
  # 取引所。現在は hyperliquid のみ対応。
  name: hyperliquid
  # testnet = 仮想資金で練習。mainnet = 本番。本番に切り替えるのは手順書の条件を満たしてから。
  network: testnet

data:
  # データの保存先ディレクトリ。相対パスはリポジトリの場所を基準にする。
  root: data
  # 研究用の足の長さ。現在は 1h のみ対応。
  interval: 1h
  # この年月からデータを取得する（YYYY-MM）。古いほど検証が厳密になるが取得に時間がかかる。
  start_month: "2020-01"
  # ダウンロードしたファイルの破損をチェックする。通常は true のまま。
  verify_checksum: true
  # 同時ダウンロード数。回線が細いなら減らす。
  parallel_downloads: 8

universe:
  # 対象銘柄の絞り込み方（ユニバース）。
  # 決済通貨。研究データは Binance の USDT 建て無期限先物を使う。
  quote: USDT
  # 出来高上位の何銘柄を対象にするか。
  top_n: 30
  # 出来高を集計する日数。直近この日数の売買代金で順位づけする。
  lookback_days: 30
  # 上場からこの日数が経っていない銘柄は除外する（上場直後は値動きが異常なため）。
  min_history_days: 90
  # 常に除外したい銘柄（例: ["LUNAUSDT"]）。
  exclude: []
  # ここに銘柄を書くと、その銘柄だけを対象にする（通常は空のまま）。
  include_only: []

risk:
  # ===== 絶対に超えない上限。戦略がどう狂ってもこの枠は破れない =====
  # 目標とする年率ボラティリティ（資産の変動幅）。0.50 = 年率50%。
  target_annual_vol: 0.50
  # 総建玉の上限（資産に対する倍率）。2.0 = 資産の2倍まで。
  max_gross_leverage: 2.0
  # 1銘柄あたりの上限（資産に対する割合）。0.15 = 資産の15%まで。
  max_position_pct: 0.15
  # 1日の損失がこの割合に達したら、その日は全て閉じて停止する。
  max_daily_loss_pct: 0.08
  # 最高値からの下落（ドローダウン）がこの割合に達したら、全て閉じて完全停止する。
  max_drawdown_pct: 0.40

notify:
  # Telegram への通知。トークン等は .env に書く。
  telegram_enabled: false
