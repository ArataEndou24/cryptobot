# =====================================================================
# cryptobot 設定ファイル
#
# 使い方: このファイルを config/settings.yaml にコピーして値を変えます。
#         `make setup` を実行すると自動でコピーされます。
# 注意:   秘密鍵やトークンはここに書きません。.env に書きます。
#         知らない項目を追加するとエラーで止まります（打ち間違い防止のため）。
# =====================================================================

exchange:
  # 取引所。現在は hyperliquid のみ対応。
  name: hyperliquid
  # testnet = 仮想資金で練習。mainnet = 本番。本番に切り替えるのは手順書の条件を満たしてから。
  network: testnet

data:
  # データの保存先ディレクトリ。相対パスはリポジトリの場所を基準にする。
  root: data
  # 研究用の足の長さ。現在は 1h のみ対応。
  interval: 1h
  # この年月からデータを取得する（YYYY-MM）。古いほど検証が厳密になるが取得に時間がかかる。
  start_month: "2020-01"
  # ダウンロードしたファイルの破損をチェックする。通常は true のまま。
  verify_checksum: true
  # 同時ダウンロード数。回線が細いなら減らす。
  parallel_downloads: 8

universe:
  # 対象銘柄の絞り込み方（ユニバース）。
  # 決済通貨。研究データは Binance の USDT 建て無期限先物を使う。
  quote: USDT
  # 出来高上位の何銘柄を対象にするか。
  top_n: 30
  # 出来高を集計する日数。直近この日数の売買代金で順位づけする。
  lookback_days: 30
  # 上場からこの日数が経っていない銘柄は除外する（上場直後は値動きが異常なため）。
  min_history_days: 90
  # 常に除外したい銘柄（例: ["LUNAUSDT"]）。
  exclude: []
  # ここに銘柄を書くと、その銘柄だけを対象にする（通常は空のまま）。
  include_only: []
  # 株式・ETF・商品（金、原油など）をトークン化した先物を、値動きの性質から判別して除外する。
  # 暗号資産の戦略には混ぜない。判定結果は `make universe` で確認できる。
  exclude_non_crypto: true
  # 取引所（Hyperliquid）に上場している銘柄だけを対象にする。
  # 上場一覧は `make exchange-symbols` で取得して保存する。保存がなければ絞り込みは行われず警告が出る。
  tradable_only: true

risk:
  # ===== 絶対に超えない上限。戦略がどう狂ってもこの枠は破れない =====
  # 目標とする年率ボラティリティ（資産の変動幅）。0.30 = 年率30%。
  # 検証では 0.50 だと最大ドローダウンが停止ライン（40%）を超えたため 0.30 に下げた（研究記録参照）。
  target_annual_vol: 0.30
  # 総建玉の上限（資産に対する倍率）。2.0 = 資産の2倍まで。
  max_gross_leverage: 2.0
  # 1銘柄あたりの上限（資産に対する割合）。0.15 = 資産の15%まで。
  max_position_pct: 0.15
  # 1日の損失がこの割合に達したら、その日は全て閉じて停止する。
  max_daily_loss_pct: 0.08
  # 最高値からの下落（ドローダウン）がこの割合に達したら、全て閉じて完全停止する。
  max_drawdown_pct: 0.40

notify:
  # Telegram への通知。トークン等は .env に書く。
  telegram_enabled: false

strategy:
  # ===== 第 1 世代戦略: クロスセクショナル・モメンタム + ファンディング・キャリー =====
  name: momentum_carry
  # モメンタムを測る期間（時間）。720 = 30 日、1440 = 60 日、2160 = 90 日。複数の平均を使う。
  # 検証で 1〜4 週間より 30〜90 日の方が、コストが 3 分の 1 でドローダウンも浅かった（研究記録参照）。
  horizons_hours: [720, 1440, 2160]
  # ボラティリティを測る期間（時間）。
  vol_lookback_hours: 720
  # 何時間ごとに目標ポジションを見直すか。
  rebalance_hours: 4
  # ユニバースのうち上位何割をロング、下位何割をショートするか（新規に建てる条件）。
  long_fraction: 0.3
  short_fraction: 0.3
  # 既に持っている銘柄は、順位がここまで落ちない限り持ち続ける（手仕舞う条件。入口より緩くして回転を抑える）。
  long_exit_fraction: 0.5
  short_exit_fraction: 0.5
  # 目標との差がこの割合未満なら売買しない。回転率を抑える。
  trade_band: 0.03
  # 帯の基準。absolute = 資産に対する割合、relative = そのポジションの大きさに対する割合。
  trade_band_mode: absolute
  # モメンタム（値動きの勢い）をどの程度重視するか。0 で無視（ファンディングだけで選ぶ）。
  momentum_weight: 1.0
  # ファンディングレートを銘柄選びにどの程度使うか。0 で使わない。
  # 検証で「使うとモメンタムの優位性を打ち消す」ことが分かったため既定は 0（研究記録参照）。
  # 損益計算ではファンディングの受け払いは常に反映される。
  funding_weight: 0.0
  # ファンディングレートを平均する期間（時間）。
  funding_lookback_hours: 72
  # 銘柄への配分方法。inverse_vol = ボラティリティの逆数、equal = 等金額。
  weighting: inverse_vol
  # ボラ目標に合わせたレバレッジを何時間ごとに更新するか。頻繁に更新すると回転率が上がる。
  leverage_update_hours: 24

backtest:
  # ===== 検証の設定。コストはわざと厳しめにしてある =====
  # 検証の開始日と終了日（終了日を空にすると最新まで）。
  start: "2022-01-01"
  end: null
  # 片道の手数料（bps = 0.01%）。4.5 bps = 0.045%。
  fee_bps: 4.5
  # 片道の滑り（指値が刺さらず不利な価格で約定する分）。
  slippage_bps: 5.0
  # 初期資金（円換算は無視し、単位は USD 相当として扱う）。
  initial_equity: 200000
