[project]
name = "cryptobot"
version = "0.1.0"
description = "暗号資産の自動売買システム（研究・検証・運用の一体基盤）"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.30",
    "numpy>=1.26",
    "pyarrow>=17",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "hyperliquid-python-sdk>=0.24.0",
]

[project.scripts]
cryptobot = "cryptobot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptobot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "N806", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "hyperliquid.*", "eth_account.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 実際のネットワークに接続するテスト（通常はスキップ）"]
addopts = "-m 'not network'"
